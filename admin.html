<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rekap Presensi SMAN 1 Kersana</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { color: #11998e; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        #loginBox { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 80px auto; text-align: center; }
        #adminContent { display: none; }
        
        .filter-box { display: flex; gap: 15px; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; font-weight: bold; color: #555; }
        input, select, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #11998e; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0e7e75; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #11998e; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .status-hadir { color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginBox">
    <h2>🔐 Login Admin</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Masukkan password untuk melihat rekap presensi.</p>
    <div class="form-group" style="margin-bottom: 15px;">
        <input type="password" id="inputPassword" placeholder="Password Admin">
    </div>
    <button onclick="cekLogin()" style="width: 100%;">Masuk Dashboard</button>
</div>

<div class="container" id="adminContent">
    <h2>📊 Dashboard Rekap Presensi</h2>
    <div class="subtitle">Sistem Monitoring Kehadiran Siswa - SMAN 1 Kersana</div>

    <div class="filter-box">
        <div class="form-group">
            <label>Cakupan Data:</label>
            <select id="filterCakupan" onchange="toggleKelasInput()">
                <option value="semua">Keseluruhan (Semua Kelas)</option>
                <option value="perkelas">Per Kelas</option>
            </select>
        </div>

        <div class="form-group" id="groupKelas" style="display: none;">
            <label>Pilih Kelas:</label>
            <select id="pilihKelas">
                <!-- Kelas X -->
                <option value="X-1">X-1</option><option value="X-2">X-2</option><option value="X-3">X-3</option>
                <option value="X-4">X-4</option><option value="X-5">X-5</option><option value="X-6">X-6</option>
                <option value="X-7">X-7</option><option value="X-8">X-8</option><option value="X-9">X-9</option>
                <!-- Kelas XI -->
                <option value="XI-1">XI-1</option><option value="XI-2">XI-2</option><option value="XI-3">XI-3</option>
                <option value="XI-4">XI-4</option><option value="XI-5">XI-5</option><option value="XI-6">XI-6</option>
                <option value="XI-7">XI-7</option><option value="XI-8">XI-8</option><option value="XI-9">XI-9</option>
                <!-- Kelas XII -->
                <option value="XII-1">XII-1</option><option value="XII-2">XII-2</option><option value="XII-3">XII-3</option>
                <option value="XII-4">XII-4</option><option value="XII-5">XII-5</option><option value="XII-6">XII-6</option>
                <option value="XII-7">XII-7</option><option value="XII-8">XII-8</option><option value="XII-9">XII-9</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tanggal Rekap:</label>
            <input type="date" id="inputTanggal">
        </div>

        <button onclick="tarikDataRekap()">🔍 Tarik Data</button>
    </div>

    <div id="statusInfo" style="font-weight: bold; margin-bottom: 10px; color: #666;">Silakan tentukan filter dan klik "Tarik Data".</div>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Waktu Kehadiran</th>
                <th>NISN</th>
                <th>Nama Siswa</th>
                <th>Kelas</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="6" style="text-align: center; color: #999;">Belum ada data yang ditarik.</td></tr>
        </tbody>
    </table>

    <div style="margin-top: 20px;">
        <a href="index.html" style="color: #11998e; text-decoration: none; font-weight: bold;">⬅️ Kembali ke Halaman Utama</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
          apiKey: "AIzaSyBgwrSnaE7KottacFI0DCUdGP1pQuJjBJw",
          authDomain: "presensi-siswa-2625a.firebaseapp.com",
          projectId: "presensi-siswa-2625a",
          storageBucket: "presensi-siswa-2625a.firebasestorage.app",
          messagingSenderId: "109107178409",
          appId: "1:109107178409:web:6cb26aadb7e6dbeb8ef2b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('inputTanggal').valueAsDate = new Date();
    const ADMIN_PASSWORD = "smankersana123"; // Ubah password admin di sini

    window.cekLogin = function() {
        const pass = document.getElementById('inputPassword').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
        } else {
            alert("Password salah!");
        }
    }

    window.toggleKelasInput = function() {
        const cakupan = document.getElementById('filterCakupan').value;
        document.getElementById('groupKelas').style.display = (cakupan === 'perkelas') ? 'flex' : 'none';
    }

    window.tarikDataRekap = async function() {
        const cakupan = document.getElementById('filterCakupan').value;
        const kelasTarget = document.getElementById('pilihKelas').value;
        const tanggalStr = document.getElementById('inputTanggal').value;
        
        const statusInfo = document.getElementById('statusInfo');
        const tableBody = document.getElementById('tableBody');

        statusInfo.innerText = "⏳ Sedang mengambil data dari Firebase...";
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Memuat data...</td></tr>`;

        try {
            const startOfDay = new Date(tanggalStr + "T00:00:00");
            const endOfDay = new Date(tanggalStr + "T23:59:59");

            let q = query(
                collection(db, "Log_Presensi"),
                where("timestamp", ">=", startOfDay),
                where("timestamp", "<=", endOfDay)
            );

            if (cakupan === 'perkelas') {
                q = query(
                    collection(db, "Log_Presensi"),
                    where("kelas", "==", kelasTarget),
                    where("timestamp", ">=", startOfDay),
                    where("timestamp", "<=", endOfDay)
                );
            }

            const querySnapshot = await getDocs(q);
            let dataLog = [];
            querySnapshot.forEach((doc) => {
                dataLog.push(doc.data());
            });

            statusInfo.innerText = `✅ Berhasil memuat ${dataLog.length} data kehadiran.`;
            
            if (dataLog.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #999;">Tidak ada data pada filter ini.</td></tr>`;
                return;
            }

            let html = "";
            dataLog.forEach((item, index) => {
                const waktuFormatted = item.timestamp ? item.timestamp.toDate().toLocaleString('id-ID') : "-";
                html += `<tr>
                    <td>${index + 1}</td>
                    <td>${waktuFormatted}</td>
                    <td>${item.nisn}</td>
                    <td>${item.nama}</td>
                    <td>${item.kelas || '-'}</td>
                    <td><span class="status-hadir">${item.status}</span></td>
                </tr>`;
            });
            tableBody.innerHTML = html;

        } catch (err) {
            console.error(err);
            statusInfo.innerText = "❌ Terjadi kesalahan saat menarik data dari Firebase.";
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Gagal memuat data. Periksa koneksi/indeks Firestore.</td></tr>`;
        }
    }
</script>

</body>
</html>
