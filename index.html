<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Multi-Wajah SMAN 1 Kersana</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%),
                        linear-gradient(220deg, #1e293b 0%, #0f172a 100%);
            background-blend-mode: overlay;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
            text-align: center;
            max-width: 720px;
            width: 100%;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .video-box-card {
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 
                        inset 0 1px 3px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 20px;
            display: inline-block;
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
        }

        .video-box {
            position: relative;
            display: block;
            border-radius: 14px;
            overflow: hidden;
            background: #0f172a;
            width: 100%;
            height: 440px;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #status {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(241, 245, 249, 0.9);
            color: #1e293b;
            border: 1px solid rgba(203, 213, 225, 0.6);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .link-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .link-nav a {
            background: #1e293b;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 12px 22px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(30, 41, 59, 0.25);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 41, 59, 0.35);
            background: #0f172a;
        }

        .link-nav a.btn-accent {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            box-shadow: 0 6px 15px rgba(249, 115, 22, 0.3);
        }

        .link-nav a.btn-accent:hover {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 Presensi Kehadiran Siswa</h2>
    <div class="subtitle">Sistem Deteksi Banyak Wajah Otomatis — SMAN 1 Kersana</div>
    
    <div class="video-box-card">
        <div class="video-box" id="videoBox">
            <video id="video" autoplay muted playsinline></video>
        </div>
    </div>

    <div id="status">Menyalakan kamera perangkat...</div>
    
    <div class="link-nav">
        <a href="register.html" class="btn-accent"><span>➕</span> Pendaftaran Siswa</a>
        <a href="admin.html"><span>🔐</span> Dashboard Admin</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
          apiKey: "AIzaSyBgwrSnaE7KottacFI0DCUdGP1pQuJjBJw",
          authDomain: "presensi-siswa-2625a.firebaseapp.com",
          projectId: "presensi-siswa-2625a",
          storageBucket: "presensi-siswa-2625a.firebasestorage.app",
          messagingSenderId: "109107178409",
          appId: "1:109107178409:web:6cb26aadb7e6dbeb8ef2b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const video = document.getElementById('video');
    const videoBox = document.getElementById('videoBox');
    let canvas = null;
    let faceMatcher = null;
    let registeredStudents = {}; 
    
    // Set untuk melacak NISN yang sudah sukses diabsen pada sesi aplikasi ini agar tidak berulang
    let completedPresensiToday = new Set();
    let isProcessing = false; // Mencegah pengiriman paralel bertubi-tubi

    function setAlertStatus(text, type = "info") {
        const statusEl = document.getElementById('status');
        if (!statusEl) return;
        statusEl.innerText = text;
        
        if (type === "error") {
            statusEl.style.background = "rgba(254, 226, 226, 0.9)";
            statusEl.style.color = "#991b1b";
            statusEl.style.borderColor = "rgba(239, 68, 68, 0.3)";
        } else if (type === "success") {
            statusEl.style.background = "rgba(220, 252, 231, 0.9)";
            statusEl.style.color = "#166534";
            statusEl.style.borderColor = "rgba(34, 197, 94, 0.3)";
        } else {
            statusEl.style.background = "rgba(241, 245, 249, 0.9)";
            statusEl.style.color = "#1e293b";
            statusEl.style.borderColor = "rgba(203, 213, 225, 0.6)";
        }
    }

    async function initSystem() {
        let lib = window.faceapi;
        if (typeof lib === 'undefined') {
            setAlertStatus("❌ Library faceapi belum terbaca!", "error");
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
        } catch (err) {
            console.error(err);
            setAlertStatus("Gagal mengakses kamera! Periksa izin browser.", "error");
            return;
        }

        try {
            setAlertStatus("Kamera aktif. Memuat model AI dari folder './models'...");
            const MODEL_URL = "./models";
            
            await lib.loadSsdMobilenetv1Model(MODEL_URL);
            await lib.loadFaceLandmarkModel(MODEL_URL);
            await lib.loadFaceRecognitionModel(MODEL_URL);

            setAlertStatus("Menarik database wajah dari Firebase...");
            
            const querySnapshot = await getDocs(collection(db, "Data_Siswa"));
            const dataSiswa = [];
            querySnapshot.forEach((doc) => {
                dataSiswa.push(doc.data());
            });

            if (dataSiswa.length === 0) {
                setAlertStatus("⚠️ Belum ada data siswa terdaftar di Firebase!", "error");
                return;
            }

            let labeledDescriptors = [];

            dataSiswa.forEach(item => {
                const nisnStr = item.nisn ? item.nisn.toString() : "";
                registeredStudents[nisnStr] = {
                    nama: item.nama || nisnStr,
                    kelas: item.kelas || "-",
                    telegramId: item.telegramId || item.chatId || ""
                };
                
                let descriptorsObj = item.descriptors || {};
                let arrayOfArrays = Object.values(descriptorsObj);
                
                let floatArrays = [];
                arrayOfArrays.forEach(descArray => {
                    if (Array.isArray(descArray) && descArray.length === 128) {
                        floatArrays.push(new Float32Array(descArray));
                    }
                });

                if (floatArrays.length > 0) {
                    labeledDescriptors.push(new lib.LabeledFaceDescriptors(nisnStr, floatArrays));
                }
            });

            if (labeledDescriptors.length === 0) {
                setAlertStatus("⚠️ Data descriptor di Firebase tidak valid atau kosong!", "error");
                return;
            }

            faceMatcher = new lib.FaceMatcher(labeledDescriptors, 0.55);
            setAlertStatus(`✅ Sistem Standby (${labeledDescriptors.length} siswa dimuat). Silakan lewat di depan kamera.`, "success");

        } catch (err) {
            console.error("Detail Error Model:", err);
            setAlertStatus("⚠️ Gagal memuat model atau mengambil data dari Firebase.", "error");
        }
    }

    video.addEventListener('play', () => {
        let lib = window.faceapi;

        if (!canvas) {
            canvas = lib.createCanvasFromMedia(video);
            videoBox.appendChild(canvas);
        }

        const displaySize = { width: video.clientWidth || 640, height: video.clientHeight || 480 };
        lib.matchDimensions(canvas, displaySize);

        setInterval(async () => {
            if (!faceMatcher || typeof lib === 'undefined' || video.paused || video.ended) return;
            if (video.videoWidth === 0 || video.videoHeight === 0) return;
            if (isProcessing) return; // Jangan scan baru jika sedang mengirim data presensi ke server

            const options = new lib.SsdMobilenetv1Options({ inputSize: 416, minConfidence: 0.5 });
            const detections = await lib.detectAllFaces(video, options)
                                        .withFaceLandmarks()
                                        .withFaceDescriptors();

            const resizedDetections = lib.resizeResults(detections, displaySize);
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (resizedDetections.length > 0) {
                for (const detection of resizedDetections) {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    const box = detection.detection.box;

                    let labelText = "Tidak Dikenali";
                    let boxColor = "#ef4444"; // Merah

                    if (match.label !== "unknown") {
                        const nisn = match.label;
                        const siswaInfo = registeredStudents[nisn] || { nama: nisn, kelas: "-", telegramId: "" };
                        
                        // Cek apakah siswa ini sudah sukses presensi pada sesi ini
                        if (completedPresensiToday.has(nisn)) {
                            labelText = `✔ ${siswaInfo.nama} (Sudah Absen)`;
                            boxColor = "#3b82f6"; // Biru (Menandakan sudah berhasil sebelumnya)
                        } else {
                            labelText = `${siswaInfo.nama} (${siswaInfo.kelas})`;
                            boxColor = "#22c55e"; // Hijau

                            // Kunci proses agar hanya berjalan 1 kali untuk siswa ini
                            isProcessing = true;
                            completedPresensiToday.add(nisn);
                            
                            await kirimPresensiFirebase(nisn, siswaInfo.nama, siswaInfo.kelas, siswaInfo.telegramId);
                            isProcessing = false;
                        }
                    }

                    const drawBox = new lib.draw.DrawBox(box, { 
                        label: labelText, 
                        boxColor: boxColor,
                        lineWidth: 3
                    });
                    drawBox.draw(canvas);
                }
            }
        }, 300);
    });

    async function kirimPresensiFirebase(nisn, namaSiswa, kelasSiswa, telegramId) {
        setAlertStatus(`🔍 Mencatat presensi BERHASIL untuk: ${namaSiswa}...`, "info");
        try {
            // Cek ekstra ke database apakah hari ini siswa tersebut sudah pernah diabsen sebelumnya
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);

            const q = query(
                collection(db, "Log_Presensi"), 
                where("nisn", "==", nisn),
                where("timestamp", ">=", Timestamp.fromDate(todayStart))
            );
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                setAlertStatus(`ℹ️ ${namaSiswa} sudah tercatat hadir hari ini di database.`, "success");
                return;
            }

            // Simpan log ke Firebase
            await addDoc(collection(db, "Log_Presensi"), {
                nisn: nisn,
                nama: namaSiswa,
                kelas: kelasSiswa,
                telegramId: telegramId,
                status: "Hadir",
                timestamp: new Date()
            });

            // Kirim notifikasi Telegram SEKALI saja
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOySQWGGx-avtP9xDRbLnbYPeMbDrONwGRkVRPuZlLkANgQyB6ayxXlyXjibyAgAg6Aw/exec";
            
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ 
                    action: "notifTelegram", 
                    telegramId: telegramId,
                    nisn: nisn, 
                    nama: namaSiswa, 
                    kelas: kelasSiswa 
                })
            }).catch(err => console.error("Gagal kirim notif Telegram:", err));

            setAlertStatus(`🎉 BERHASIL: Presensi ${namaSiswa} (${kelasSiswa}) telah dicatat & Notifikasi dikirim!`, "success");
        } catch (e) {
            console.error(e);
            setAlertStatus("❌ Gagal mencatat presensi ke Firebase.", "error");
            completedPresensiToday.delete(nisn); // Lepaskan kunci jika terjadi error agar bisa dicoba lagi
            isProcessing = false;
        }
    }

    window.addEventListener('DOMContentLoaded', initSystem);
</script>
</body>
</html>
