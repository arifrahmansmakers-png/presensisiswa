<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Wajah Otomatis SMAN 1 Kersana</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.8/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; max-width: 600px; width: 100%; }
        h2 { color: #222; margin-bottom: 5px; font-weight: 700; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .video-box { position: relative; display: inline-block; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.15); background: #000; width: 100%; max-width: 500px; height: 375px; }
        video { display: block; width: 100%; height: 100%; object-fit: cover; }
        #status { font-size: 15px; font-weight: bold; margin-top: 20px; padding: 12px; border-radius: 8px; background: #e8f5e9; color: #2e7d32; transition: all 0.3s; }
        .link-nav { margin-top: 15px; font-size: 14px; }
        .link-nav a { color: #11998e; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 Presensi Kehadiran Siswa</h2>
    <div class="subtitle">Sistem Deteksi Wajah Otomatis SMAN 1 Kersana</div>
    
    <div class="video-box">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="status">Menyalakan kamera perangkat...</div>
    
    <div class="link-nav">
        <a href="register.html">➡️ Buka Halaman Pendaftaran Siswa</a>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzB_jSNRzQmAWMRWEsG64QqLvss7uUTE9ka1JdVEa_3mbgc0UC9nGt482w5PrdxYH6lQw/exec";

    const video = document.getElementById('video');
    let faceMatcher = null;
    let isProcessing = false;

    function setAlertStatus(text, isError) {
        const statusEl = document.getElementById('status');
        if (!statusEl) return;
        statusEl.innerText = text;
        if (isError) {
            statusEl.style.background = "#f8d7da";
            statusEl.style.color = "#721c24";
        } else {
            statusEl.style.background = "#e8f5e9";
            statusEl.style.color = "#2e7d32";
        }
    }

    async function initSystem() {
        // Cek apakah library face-api.min.js berhasil termuat
        if (typeof faceapi === 'undefined') {
            setAlertStatus("❌ Gagal: File 'face-api.min.js' tidak ditemukan di root folder GitHub!", true);
            console.error("Library faceapi is undefined.");
            return;
        }

        // 1. Nyalakan Kamera
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
        } catch (err) {
            console.error(err);
            setAlertStatus("Gagal mengakses kamera! Pastikan izin kamera diaktifkan.", true);
            return;
        }

        // 2. Load Model AI dari Folder Lokal './models' & Tarik Database
        try {
            setAlertStatus("Kamera aktif. Memuat model AI dari folder lokal './models'...");
            
            await faceapi.nets.ssdMobilenetv1.loadFromUri('./models');
            await faceapi.nets.faceLandmarkNet.loadFromUri('./models');
            await faceapi.nets.faceRecognitionNet.loadFromUri('./models');

            setAlertStatus("Menarik database wajah dari Spreadsheet...");
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getData" })
            });
            const dataSiswa = await res.json();

            if (!Array.isArray(dataSiswa) || dataSiswa.length === 0) {
                setAlertStatus("⚠️ Belum ada data siswa terdaftar di Spreadsheet!", false);
                return;
            }

            let labeledDescriptors = dataSiswa.map(item => {
                let floatArrays = item.descriptors.map(desc => new Float32Array(desc));
                return new faceapi.LabeledFaceDescriptors(item.nisn.toString(), floatArrays);
            });

            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.52);
            setAlertStatus("✅ Sistem Standby. Silakan lewat di depan kamera.", false);

        } catch (err) {
            console.error(err);
            setAlertStatus("⚠️ Gagal memuat model dari folder './models'. Periksa kelengkapan file di GitHub.", true);
        }
    }

    video.addEventListener('play', () => {
        setInterval(async () => {
            if (isProcessing || !faceMatcher || typeof faceapi === 'undefined') return;

            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

            if (detection) {
                const match = faceMatcher.findBestMatch(detection.descriptor);

                if (match.label !== "unknown") {
                    isProcessing = true;
                    let nisn = match.label;
                    
                    setAlertStatus(`🔍 Wajah dikenali (NISN: ${nisn}). Mengirim presensi...`, false);

                    try {
                        let response = await fetch(WEB_APP_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "presensi", nisn: nisn })
                        });
                        let result = await response.json();

                        if (result.status === "success") {
                            setAlertStatus(`✅ Hadir: ${result.nama} (Notifikasi Telegram Terkirim)`, false);
                        } else {
                            setAlertStatus(`⚠️ ${result.message}`, true);
                        }
                    } catch (e) {
                        setAlertStatus("❌ Gagal terhubung ke server Apps Script.", true);
                    }

                    setTimeout(() => {
                        isProcessing = false;
                        setAlertStatus("✅ Sistem Standby. Silakan lewat di depan kamera.", false);
                    }, 6000);
                }
            }
        }, 1500);
    });

    // Jalankan sistem setelah halaman siap
    window.addEventListener('DOMContentLoaded', initSystem);
</script>
</body>
</html>
