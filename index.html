<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Wajah Otomatis SMAN 1 Kersana</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; max-width: 600px; width: 100%; }
        h2 { color: #222; margin-bottom: 5px; font-weight: 700; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .video-box { position: relative; display: inline-block; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.15); background: #000; }
        video { display: block; width: 100%; max-width: 500px; height: auto; }
        #status { font-size: 18px; font-weight: bold; margin-top: 20px; padding: 12px; border-radius: 8px; background: #e8f5e9; color: #2e7d32; transition: all 0.3s; }
        .link-nav { margin-top: 15px; font-size: 14px; }
        .link-nav a { color: #11998e; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 Presensi Kehadiran Siswa</h2>
    <div class="subtitle">Sistem Deteksi Wajah Otomatis SMAN 1 Kersana</div>
    
    <div class="video-box">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="status">Memuat Model AI & Database Wajah...</div>
    
    <div class="link-nav">
        <a href="register.html">➡️ Buka Halaman Pendaftaran Siswa</a>
    </div>
</div>

<script>
    // PASTI KAN URL GOOGLE APPS SCRIPT ANDA DITEMPEL DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzB_jSNRzQmAWMRWEsG64QqLvss7uUTE9ka1JdVEa_3mbgc0UC9nGt482w5PrdxYH6lQw/exec"; 
    
    const video = document.getElementById('video');
    let faceMatcher = null;
    let isProcessing = false;

    async function initSystem() {
        try {
            document.getElementById('status').innerText = "Memuat model AI pendeteksi wajah...";
            await faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');
            await faceapi.nets.faceLandmarkNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');
            await faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');

            document.getElementById('status').innerText = "Menarik database wajah dari Spreadsheet...";
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getData" })
            });
            const dataSiswa = await res.json();

            if (dataSiswa.length === 0) {
                document.getElementById('status').innerText = "⚠️ Belum ada data siswa terdaftar di database!";
                return;
            }

            let labeledDescriptors = dataSiswa.map(item => {
                let floatArrays = item.descriptors.map(desc => new Float32Array(desc));
                return new faceapi.LabeledFaceDescriptors(item.nisn.toString(), floatArrays);
            });

            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.52);

            document.getElementById('status').innerText = "Kamera Standby. Silakan lewat di depan kamera.";
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
            video.srcObject = stream;
        } catch (err) {
            document.getElementById('status').innerText = "Gagal memuat kamera atau izin ditolak!";
        }
    }

    video.addEventListener('play', () => {
        setInterval(async () => {
            if (isProcessing || !faceMatcher) return;

            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

            if (detection) {
                const match = faceMatcher.findBestMatch(detection.descriptor);

                if (match.label !== "unknown") {
                    isProcessing = true;
                    let nisn = match.label;
                    
                    document.getElementById('status').style.background = "#fff3cd";
                    document.getElementById('status').style.color = "#856404";
                    document.getElementById('status').innerText = `🔍 Wajah dikenali (NISN: ${nisn}). Mengirim presensi...`;

                    try {
                        let response = await fetch(WEB_APP_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "presensi", nisn: nisn })
                        });
                        let result = await response.json();

                        if (result.status === "success") {
                            document.getElementById('status').style.background = "#d4edda";
                            document.getElementById('status').style.color = "#155724";
                            document.getElementById('status').innerText = `✅ Berhasil Hadir: ${result.nama}! Telegram terkirim.`;
                        } else {
                            document.getElementById('status').style.background = "#f8d7da";
                            document.getElementById('status').style.color = "#721c24";
                            document.getElementById('status').innerText = `⚠️ ${result.message}`;
                        }
                    } catch (e) {
                        document.getElementById('status').innerText = "❌ Gagal terhubung ke server.";
                    }

                    setTimeout(() => {
                        isProcessing = false;
                        document.getElementById('status').style.background = "#e8f5e9";
                        document.getElementById('status').style.color = "#2e7d32";
                        document.getElementById('status').innerText = "Kamera Standby. Silakan lewat di depan kamera.";
                    }, 6000);
                }
            }
        }, 1500);
    });

    initSystem();
</script>
</body>
</html>
