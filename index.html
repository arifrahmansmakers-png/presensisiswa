<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Multi-Wajah SMAN 1 Kersana</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%),
                        linear-gradient(220deg, #1e293b 0%, #0f172a 100%);
            background-blend-mode: overlay;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
            text-align: center;
            max-width: 720px;
            width: 100%;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Card Kotak Kamera yang Elegan & Timbul */
        .video-box-card {
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 
                        inset 0 1px 3px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 20px;
            display: inline-block;
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
        }

        .video-box {
            position: relative;
            display: block;
            border-radius: 14px;
            overflow: hidden;
            background: #0f172a;
            width: 100%;
            height: 440px;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #status {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(241, 245, 249, 0.9);
            color: #1e293b;
            border: 1px solid rgba(203, 213, 225, 0.6);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* Navigasi / Tombol Timbul Tema Navy & Oranye */
        .link-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .link-nav a {
            background: #1e293b;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 12px 22px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(30, 41, 59, 0.25);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 41, 59, 0.35);
            background: #0f172a;
        }

        .link-nav a.btn-accent {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            box-shadow: 0 6px 15px rgba(249, 115, 22, 0.3);
        }

        .link-nav a.btn-accent:hover {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 Presensi Kehadiran Siswa</h2>
    <div class="subtitle">Sistem Deteksi Banyak Wajah Otomatis — SMAN 1 Kersana</div>
    
    <!-- Card Kotak Kamera -->
    <div class="video-box-card">
        <div class="video-box" id="videoBox">
            <video id="video" autoplay muted playsinline></video>
        </div>
    </div>

    <div id="status">Menyalakan kamera perangkat...</div>
    
    <!-- Tombol Navigasi Timbul -->
    <div class="link-nav">
        <a href="register.html" class="btn-accent"><span>➕</span> Pendaftaran Siswa</a>
        <a href="admin.html"><span>🔐</span> Dashboard Admin</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
          apiKey: "AIzaSyBgwrSnaE7KottacFI0DCUdGP1pQuJjBJw",
          authDomain: "presensi-siswa-2625a.firebaseapp.com",
          projectId: "presensi-siswa-2625a",
          storageBucket: "presensi-siswa-2625a.firebasestorage.app",
          messagingSenderId: "109107178409",
          appId: "1:109107178409:web:6cb26aadb7e6dbeb8ef2b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const video = document.getElementById('video');
    const videoBox = document.getElementById('videoBox');
    let canvas = null;
    let faceMatcher = null;
    let registeredStudents = {}; 
    let recentPresensi = {}; 

    function setAlertStatus(text, isError) {
        const statusEl = document.getElementById('status');
        if (!statusEl) return;
        statusEl.innerText = text;
        if (isError) {
            statusEl.style.background = "rgba(254, 226, 226, 0.9)";
            statusEl.style.color = "#991b1b";
            statusEl.style.borderColor = "rgba(239, 68, 68, 0.3)";
        } else {
            statusEl.style.background = "rgba(220, 252, 231, 0.9)";
            statusEl.style.color = "#166534";
            statusEl.style.borderColor = "rgba(34, 197, 94, 0.3)";
        }
    }

    async function initSystem() {
        let lib = window.faceapi;
        if (typeof lib === 'undefined') {
            setAlertStatus("❌ Library faceapi belum terbaca!", true);
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
        } catch (err) {
            console.error(err);
            setAlertStatus("Gagal mengakses kamera! Periksa izin browser.", true);
            return;
        }

        try {
            setAlertStatus("Kamera aktif. Memuat model AI dari folder './models'...");
            const MODEL_URL = "./models";
            
            await lib.loadSsdMobilenetv1Model(MODEL_URL);
            await lib.loadFaceLandmarkModel(MODEL_URL);
            await lib.loadFaceRecognitionModel(MODEL_URL);

            setAlertStatus("Menarik database wajah dari Firebase...");
            
            const querySnapshot = await getDocs(collection(db, "Data_Siswa"));
            const dataSiswa = [];
            querySnapshot.forEach((doc) => {
                dataSiswa.push(doc.data());
            });

            if (dataSiswa.length === 0) {
                setAlertStatus("⚠️ Belum ada data siswa terdaftar di Firebase!", true);
                return;
            }

            let labeledDescriptors = dataSiswa.map(item => {
                const nisnStr = item.nisn ? item.nisn.toString() : "";
                registeredStudents[nisnStr] = {
                    nama: item.nama || nisnStr,
                    kelas: item.kelas || "-",
                    telegramId: item.telegramId || ""
                };
                
                let floatArrays = (item.descriptors || []).map(desc => new Float32Array(desc));
                return new lib.LabeledFaceDescriptors(nisnStr, floatArrays);
            });

            faceMatcher = new lib.FaceMatcher(labeledDescriptors, 0.55);
            setAlertStatus(`✅ Sistem Standby (${dataSiswa.length} siswa dimuat). Silakan lewat di depan kamera.`, false);

        } catch (err) {
            console.error("Detail Error Model:", err);
            setAlertStatus("⚠️ Gagal memuat model atau mengambil data dari Firebase.", true);
        }
    }

    video.addEventListener('play', () => {
        let lib = window.faceapi;

        canvas = lib.createCanvasFromMedia(video);
        videoBox.appendChild(canvas);

        const displaySize = { width: video.clientWidth || 640, height: video.clientHeight || 480 };
        lib.matchDimensions(canvas, displaySize);

        setInterval(async () => {
            if (!faceMatcher || typeof lib === 'undefined') return;

            const detections = await lib.detectAllFaces(video, new lib.SsdMobilenetv1Options({ inputSize: 512, minConfidence: 0.5 }))
                                        .withFaceLandmarks()
                                        .withFaceDescriptors();

            const resizedDetections = lib.resizeResults(detections, displaySize);
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (resizedDetections.length > 0) {
                resizedDetections.forEach(detection => {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    const box = detection.detection.box;

                    let labelText = "Tidak Dikenali";
                    let boxColor = "#ef4444";

                    if (match.label !== "unknown") {
                        const nisn = match.label;
                        const siswaInfo = registeredStudents[nisn] || { nama: nisn, kelas: "-", telegramId: "" };
                        labelText = `${siswaInfo.nama} (${siswaInfo.kelas})`;
                        boxColor = "#22c55e";

                        const now = Date.now();
                        if (!recentPresensi[nisn] || (now - recentPresensi[nisn] > 10000)) {
                            recentPresensi[nisn] = now;
                            kirimPresensiFirebase(nisn, siswaInfo.nama, siswaInfo.kelas, siswaInfo.telegramId);
                        }
                    }

                    const drawBox = new lib.draw.DrawBox(box, { 
                        label: labelText, 
                        boxColor: boxColor,
                        lineWidth: 2
                    });
                    drawBox.draw(canvas);
                });
            }
        }, 500);
    });

    async function kirimPresensiFirebase(nisn, namaSiswa, kelasSiswa, telegramId) {
        setAlertStatus(`🔍 Memproses presensi: ${namaSiswa}...`, false);
        try {
            await addDoc(collection(db, "Log_Presensi"), {
                nisn: nisn,
                nama: namaSiswa,
                kelas: kelasSiswa,
                telegramId: telegramId,
                status: "Hadir",
                timestamp: new Date()
            });

            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOySQWGGx-avtP9xDRbLnbYPeMbDrONwGRkVRPuZlLkANgQyB6ayxXlyXjibyAgAg6Aw/exec";
            
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ 
                    action: "notifTelegram", 
                    telegramId: telegramId,
                    nisn: nisn, 
                    nama: namaSiswa, 
                    kelas: kelasSiswa 
                })
            }).catch(err => console.error("Gagal kirim notif Telegram:", err));

            setAlertStatus(`✅ Hadir: ${namaSiswa} (${kelasSiswa}) - Notifikasi Privat Dikirim`, false);
        } catch (e) {
            console.error(e);
            setAlertStatus("❌ Gagal mencatat presensi ke Firebase.", true);
        }
    }

    window.addEventListener('DOMContentLoaded', initSystem);
</script>
</body>
</html>
