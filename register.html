<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Siswa - SMAN 1 Kersana</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 500px; width: 100%; text-align: center; }
        h2 { color: #222; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444; }
        input, select, button { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .video-box { position: relative; display: inline-block; border-radius: 10px; overflow: hidden; background: #000; width: 100%; max-height: 300px; margin-bottom: 15px; }
        video { width: 100%; display: block; }
        button { background: #11998e; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background: #0e7e75; }
        #status { font-size: 14px; font-weight: bold; margin-top: 15px; padding: 10px; border-radius: 6px; background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Pendaftaran Wajah Siswa</h2>
    <div class="subtitle">SMAN 1 Kersana</div>

    <div class="video-box">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div class="form-group">
        <label>NISN:</label>
        <input type="text" id="nisn" placeholder="Masukkan NISN siswa">
    </div>

    <div class="form-group">
        <label>Nama Lengkap:</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap">
    </div>

    <div class="form-group">
        <label>Kelas:</label>
        <select id="kelas">
<option value="">-- Pilih Kelas --</option>
            <!-- Kelas X -->
            <option value="X-1">X-1</option>
            <option value="X-2">X-2</option>
            <option value="X-3">X-3</option>
            <option value="X-4">X-4</option>
            <option value="X-5">X-5</option>
            <option value="X-6">X-6</option>
            <option value="X-7">X-7</option>
            <option value="X-8">X-8</option>
            <option value="X-9">X-9</option>

            <!-- Kelas XI -->
            <option value="XI-1">XI-1</option>
            <option value="XI-2">XI-2</option>
            <option value="XI-3">XI-3</option>
            <option value="XI-4">XI-4</option>
            <option value="XI-5">XI-5</option>
            <option value="XI-6">XI-6</option>
            <option value="XI-7">XI-7</option>
            <option value="XI-8">XI-8</option>
            <option value="XI-9">XI-9</option>

            <!-- Kelas XII -->
            <option value="XII-1">XII-1</option>
            <option value="XII-2">XII-2</option>
            <option value="XII-3">XII-3</option>
            <option value="XII-4">XII-4</option>
            <option value="XII-5">XII-5</option>
            <option value="XII-6">XII-6</option>
            <option value="XII-7">XII-7</option>
            <option value="XII-8">XII-8</option>
            <option value="XII-9">XII-9</option>
        </select>
    </div>

    <button onclick="prosesPendaftaran()">📸 Ambil Wajah & Daftar</button>
    <div id="status">Menyiapkan kamera & model AI...</div>

    <div style="margin-top: 15px;">
        <a href="index.html" style="color: #11998e; text-decoration: none; font-weight: bold;">⬅️ Kembali ke Presensi</a>
    </div>
</div>

<script type="module">
    // Menggunakan Firebase Web SDK v10+ (Modular)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // KELENGKAPAN KONFIGURASI FIREBASE ANDA
    const firebaseConfig = {
          apiKey: "AIzaSyBgwrSnaE7KottacFI0DCUdGP1pQuJjBJw",
          authDomain: "presensi-siswa-2625a.firebaseapp.com",
          projectId: "presensi-siswa-2625a",
          storageBucket: "presensi-siswa-2625a.firebasestorage.app",
          messagingSenderId: "109107178409",
          appId: "1:109107178409:web:6cb26aadb7e6dbeb8ef2b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const video = document.getElementById('video');
    let lib = window.faceapi;

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
            video.srcObject = stream;
            
            document.getElementById('status').innerText = "Memuat model AI pengenalan wajah...";
            const MODEL_URL = "./models";
            await lib.loadSsdMobilenetv1Model(MODEL_URL);
            await lib.loadFaceLandmarkModel(MODEL_URL);
            await lib.loadFaceRecognitionModel(MODEL_URL);
            
            document.getElementById('status').innerText = "Sistem Siap. Silakan isi data dan daftar.";
        } catch (err) {
            console.error(err);
            document.getElementById('status').innerText = "Gagal mengaktifkan kamera/model AI.";
        }
    }

    window.prosesPendaftaran = async function() {
        const nisn = document.getElementById('nisn').value.trim();
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;
        const statusEl = document.getElementById('status');

        if (!nisn || !nama || !kelas) {
            alert("Harap isi NISN, Nama, dan pilih Kelas terlebih dahulu!");
            return;
        }

        statusEl.innerText = "Mendeteksi wajah... Tetap tenang di depan kamera.";

        // Deteksi wajah tunggal untuk registrasi
        const detection = await lib.detectSingleFace(video, new lib.SsdMobilenetv1Options())
                                   .withFaceLandmarks()
                                   .withFaceDescriptor();

        if (!detection) {
            alert("Wajah tidak terdeteksi! Pastikan posisi wajah pas di kamera.");
            statusEl.innerText = "Deteksi wajah gagal.";
            return;
        }

        try {
            // Cek apakah NISN sudah terdaftar di Firestore
            const q = query(collection(db, "Data_Siswa"), where("nisn", "==", nisn));
            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                alert("NISN ini sudah terdaftar sebelumnya!");
                statusEl.innerText = "NISN sudah ada di database.";
                return;
            }

            // Simpan descriptor sebagai array biasa agar bisa masuk ke Firestore JSON
            const descriptorArray = Array.from(detection.descriptor);

            await addDoc(collection(db, "Data_Siswa"), {
                nisn: nisn,
                nama: nama,
                kelas: kelas,
                descriptors: [descriptorArray], // Disimpan dalam bentuk array of descriptors
                createdAt: new Date()
            });

            alert(`Pendaftaran berhasil untuk ${nama} (${kelas})!`);
            statusEl.innerText = "Berhasil terdaftar!";
            document.getElementById('nisn').value = "";
            document.getElementById('nama').value = "";
            document.getElementById('kelas').value = "";
        } catch (e) {
            console.error("Error saving: ", e);
            alert("Gagal menyimpan data ke Firebase.");
            statusEl.innerText = "Gagal menyimpan database.";
        }
    }

    window.addEventListener('DOMContentLoaded', initCamera);
</script>
</body>
</html>
