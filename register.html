<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Wajah Siswa - SMAN 1 Kersana</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; max-width: 500px; width: 100%; }
        h2 { color: #222; margin-bottom: 5px; font-weight: 700; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-weight: bold; font-size: 13px; color: #444; margin-bottom: 4px; }
        input { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .video-box { position: relative; display: inline-block; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.15); background: #000; width: 100%; height: 220px; margin-bottom: 12px; }
        video { display: block; width: 100%; height: 100%; object-fit: cover; }
        button { background: #11998e; color: white; border: none; padding: 11px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.3s; }
        button:hover { background: #0e7e75; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #status { font-size: 13px; font-weight: bold; margin-top: 12px; padding: 10px; border-radius: 8px; background: #e8f5e9; color: #2e7d32; }
        .link-nav { margin-top: 12px; font-size: 14px; }
        .link-nav a { color: #11998e; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Pendaftaran Wajah Siswa</h2>
    <div class="subtitle">SMAN 1 Kersana</div>
    
    <div class="form-group">
        <label for="nisn">NISN Siswa:</label>
        <input type="text" id="nisn" placeholder="Contoh: 0081234567">
    </div>

    <div class="form-group">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" placeholder="Contoh: Ahmad Dani">
    </div>

    <div class="form-group">
        <label for="chatId">Telegram Chat ID (Untuk Notifikasi):</label>
        <input type="text" id="chatId" placeholder="Contoh: 123456789 (kosongkan jika belum ada)">
    </div>

    <div class="video-box">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <button id="btnDaftar" onclick="mulaiPendaftaran()" disabled>Menyiapkan Sistem...</button>
    <div id="status">Meminta izin kamera perangkat...</div>
    
    <div class="link-nav">
        <a href="index.html">⬅️ Kembali ke Halaman Presensi</a>
    </div>
</div>

<script>
    const WEB_APP_URL = "URL_WEB_APP_ANDA_DISINI"; // Ganti dengan URL /exec Anda

    const video = document.getElementById('video');
    let isModelLoaded = false;

    async function initCameraAndAI() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;

            document.getElementById('status').innerText = "Memuat model AI pendeteksi wajah...";
            
            await faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');
            await faceapi.nets.faceLandmarkNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');
            await faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');

            isModelLoaded = true;
            document.getElementById('status').innerText = "Kamera & AI Siap. Silakan isi data lalu klik Daftar.";
            document.getElementById('btnDaftar').innerText = "Daftarkan Wajah Sekarang";
            document.getElementById('btnDaftar').disabled = false;

        } catch (err) {
            console.error(err);
            document.getElementById('status').style.background = "#f8d7da";
            document.getElementById('status').style.color = "#721c24";
            document.getElementById('status').innerText = "Gagal memuat kamera atau izin ditolak!";
        }
    }

    async function mulaiPendaftaran() {
        const nisn = document.getElementById('nisn').value.trim();
        const nama = document.getElementById('nama').value.trim();
        const chatId = document.getElementById('chatId').value.trim();

        if (!nisn || !nama) {
            alert("Harap isi NISN dan Nama lengkap terlebih dahulu!");
            return;
        }

        if (!isModelLoaded) {
            alert("Model AI masih memuat, mohon tunggu sebentar...");
            return;
        }

        const btn = document.getElementById('btnDaftar');
        btn.disabled = true;
        document.getElementById('status').innerText = "Mendeteksi wajah, mohon hadap lurus ke kamera...";

        let descriptors = [];
        for (let i = 0; i < 3; i++) {
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            if (detection) {
                descriptors.push(Array.from(detection.descriptor));
            }
            await new Promise(resolve => setTimeout(resolve, 500));
        }

        if (descriptors.length === 0) {
            alert("Wajah tidak terdeteksi! Pastikan posisi wajah pas dan pencahayaan cukup.");
            btn.disabled = false;
            document.getElementById('status').innerText = "Pendaftaran gagal. Coba lagi.";
            return;
        }

        document.getElementById('status').innerText = "Mengirim data wajah & Chat ID ke Spreadsheet...";

        try {
            const response = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "register",
                    nisn: nisn,
                    nama: nama,
                    chatId: chatId, // Dikirim ke backend Google Apps Script
                    descriptors: descriptors
                })
            });
            const result = await response.json();

            if (result.status === "success") {
                document.getElementById('status').style.background = "#d4edda";
                document.getElementById('status').style.color = "#155724";
                document.getElementById('status').innerText = `✅ Berhasil! Siswa ${nama} terdaftar.`;
                document.getElementById('nisn').value = "";
                document.getElementById('nama').value = "";
                document.getElementById('chatId').value = "";
            } else {
                document.getElementById('status').style.background = "#f8d7da";
                document.getElementById('status').style.color = "#721c24";
                document.getElementById('status').innerText = `⚠️ Gagal: ${result.message}`;
            }
        } catch (e) {
            console.error(e);
            alert("Terjadi kesalahan jaringan saat mengirim data.");
            document.getElementById('status').innerText = "Gagal terhubung ke server.";
        } finally {
            btn.disabled = false;
        }
    }

    initCameraAndAI();
</script>
</body>
</html>
